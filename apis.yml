name: Omnius
description: >-
  omni:us (operated by Qidenus Group GmbH, Berlin) is an insurance technology
  company building agentic AI for claims processing. Its platform automates
  end-to-end claims handling — from first notice of loss to settlement — across
  property, casualty, and marine lines, combining document intake, machine
  reading of structured and unstructured text, images and handwriting, and
  decision support trained on millions of annotated claims and insurance
  documents. Products include No-Touch Claim Automation, an Agentic Co-Pilot for
  complex claim decisions, Leakage Reduction, and a custom Insurance AI Modeller.
  omni:us was surfaced as a portfolio company of the venture firm Anthemis and
  added to the API Evangelist network. As of this enrichment pass the company
  markets an enterprise B2B product sold direct to carriers; it publishes a
  public marketing site, blog, and legal terms, but exposes no public developer
  portal, API documentation, or machine-readable API contract.
